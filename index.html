<style>
  :root {
    --bg: #000000;
    --bg-soft: #0a0a0a;
    --accent: #ffffff;
    --accent-dim: #cfcfcf;
    --text: #f2f2f2;
    --muted: #8a8a8a;
    --card: #121212;
    --border: #2a2a2a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 28px;
    position: relative;
    z-index: 2;
  }
  .brand {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 19px;
    letter-spacing: -0.02em;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .brand img { display: block; height: 20px; width: auto; }
  .header-right {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .icon-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn svg { width: 16px; height: 16px; }
  .by-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.03em;
  }
  main {
    position: relative;
    z-index: 2;
    max-width: 720px;
    margin: 0 auto;
    padding: 0 20px 60px;
  }
  .hero {
    min-height: 62vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    transition: min-height 0.4s ease;
  }
  .hero.compact {
    min-height: 0;
    padding: 30px 0 20px;
  }
  .orb {
    width: 46px; height: 46px;
    border-radius: 50%;
    margin-bottom: 22px;
    background: radial-gradient(circle at 35% 30%, #ffffff, #d9d9d9 60%, transparent 100%);
    box-shadow: 0 0 40px 6px rgba(255,255,255,0.25);
    animation: pulse 3.5s ease-in-out infinite;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .orb img { width: 55%; height: 55%; object-fit: contain; }
  .hero.compact .orb { width: 28px; height: 28px; margin-bottom: 0; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.12); opacity: 0.85; }
  }
  .orb.thinking { animation: pulse 0.9s ease-in-out infinite; }
  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 600;
    margin: 0 0 10px;
    letter-spacing: -0.02em;
  }
  .hero.compact h1 { display: none; }
  .tagline {
    color: var(--muted);
    font-size: 15px;
    margin-bottom: 34px;
    font-family: 'IBM Plex Mono', monospace;
  }
  .hero.compact .tagline { display: none; }
  .search-wrap {
    width: 100%;
    position: relative;
  }
  .search-box {
    display: flex;
    align-items: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 4px 4px 4px 18px;
    transition: border-color 0.2s;
  }
  .search-box:focus-within {
    border-color: var(--accent);
  }
  #q {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 15.5px;
    font-family: 'Inter', sans-serif;
    padding: 14px 8px;
    min-width: 0;
  }
  #q::placeholder { color: var(--muted); }
  #askBtn {
    background: var(--accent);
    color: #0a0a0a;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    flex-shrink: 0;
  }
  #askBtn:disabled { opacity: 0.5; cursor: default; }
  .chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 18px;
  }
  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 7px 14px;
    cursor: pointer;
    background: var(--bg-soft);
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }

  #results { display: none; }
  #results.show { display: block; }

  .answer-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    line-height: 1.7;
    font-size: 15px;
    overflow-wrap: anywhere;
  }
  .answer-card .q-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
  }
  .sources-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 12px 4px;
  }
  .source-card {
    display: block;
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 13px 16px;
    margin-bottom: 8px;
    text-decoration: none;
    color: var(--text);
    font-size: 13.5px;
    overflow-wrap: anywhere;
  }
  .source-card .n {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    margin-right: 6px;
  }
  .source-card .domain {
    color: var(--muted);
    font-size: 12px;
    margin-top: 3px;
  }
  .loading-text {
    text-align: center;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    margin-top: 16px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 30px 0 10px;
  }

  /* History panel */
  .overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 10;
    align-items: flex-start;
    justify-content: flex-end;
  }
  .overlay.show { display: flex; }
  .history-panel {
    background: var(--bg-soft);
    border-left: 1px solid var(--border);
    width: 100%;
    max-width: 360px;
    height: 100%;
    padding: 20px;
    overflow-y: auto;
  }
  .history-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .history-head h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px;
    margin: 0;
  }
  .history-actions { display: flex; gap: 8px; }
  .text-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    padding: 4px 0;
  }
  .text-btn:hover { color: var(--accent); }
  .history-item {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    text-align: left;
    width: 100%;
    color: var(--text);
    font-family: 'Inter', sans-serif;
    font-size: 13px;
  }
  .history-item:hover { border-color: var(--accent); }
  .history-item .h-time {
    display: block;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10.5px;
    margin-top: 4px;
  }
  .history-empty {
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    text-align: center;
    margin-top: 30px;
  }
</style>
</head>

      <h1>Ask Realm</h1>
      <div class="tagline">Where knowledge begins</div>

      <div class="search-wrap">
        <div class="search-box">
          <input id="q" type="text" placeholder="Ask anything, in any language..." autocomplete="off" maxlength="2000">
          <button id="askBtn">Search</button>
        </div>
        <div class="chips">
          <div class="chip" data-q="What are today's top tech news stories?">Tech news today</div>
          <div class="chip" data-q="Explain the greenhouse effect in simple terms.">Greenhouse effect</div>
          <div class="chip" data-q="What are the latest breakthroughs in AI?">Latest AI breakthroughs</div>
        </div>
      </div>
    </div>

    <div id="results">
      <div class="answer-card">
        <div class="q-label" id="qLabel"></div>
        <div id="answerText"></div>
      </div>
      <div id="sourcesBlock"></div>
    </div>
  </main>

  <footer>powered by Gemini &bull; developed by Enhanced Tech</footer>

  <div class="overlay" id="historyOverlay">
    <div class="history-panel">
      <div class="history-head">
        <h2>History</h2>
        <div class="history-actions">
          <button class="text-btn" id="clearHistoryBtn">Clear</button>
          <button class="text-btn" id="closeHistoryBtn">Close</button>
        </div>
      </div>
      <div id="historyList"></div>
    </div>
  </div>

<script>
'use strict';

// ---- Config ----
// Relative path keeps this working on any domain the app is deployed to
// (production, preview deployments, custom domains) without edits, and
// keeps the CSP connect-src restricted to 'self'. If your API route lives
// on a different origin, change this to an absolute URL and update the
// connect-src value in the CSP <meta> tag above to match.
const API_URL = "/api/search";
const HISTORY_KEY = "realm_conversations";
const MAX_HISTORY = 30;
const MAX_QUERY_LENGTH = 2000;
const REQUEST_TIMEOUT_MS = 30000;
const MIN_MS_BETWEEN_REQUESTS = 1000;

// ---- Elements ----
const hero = document.getElementById('hero');
const orb = document.getElementById('orb');
const q = document.getElementById('q');
const askBtn = document.getElementById('askBtn');
const results = document.getElementById('results');
const answerText = document.getElementById('answerText');
const qLabel = document.getElementById('qLabel');
const sourcesBlock = document.getElementById('sourcesBlock');
const historyBtn = document.getElementById('historyBtn');
const historyOverlay = document.getElementById('historyOverlay');
const historyList = document.getElementById('historyList');
const clearHistoryBtn = document.getElementById('clearHistoryBtn');
const closeHistoryBtn = document.getElementById('closeHistoryBtn');

let isLoading = false;
let lastRequestAt = 0;

// ---- Security helpers ----
// Escape everything before it ever touches innerHTML. The API response is
// untrusted input (it can reflect web search results or model output that
// may itself have been targeted by prompt injection), so it is treated the
// same as any other untrusted string: never inserted as raw HTML.
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// Only allow http/https links to be rendered as clickable sources.
// Blocks javascript:, data:, and other schemes a manipulated response
// could try to smuggle in.
function safeUrl(url) {
  try {
    const u = new URL(url, window.location.href);
    if (u.protocol === 'http:' || u.protocol === 'https:') return u.href;
  } catch (e) {}
  return null;
}

// ---- History (stored locally in this browser only) ----
function loadHistory() {
  try {
    const raw = localStorage.getItem(HISTORY_KEY);
    const parsed = raw ? JSON.parse(raw) : [];
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function saveToHistory(entry) {
  try {
    const list = loadHistory();
    list.unshift(entry);
    while (list.length > MAX_HISTORY) list.pop();
    localStorage.setItem(HISTORY_KEY, JSON.stringify(list));
  } catch (e) {
    // Storage may be unavailable (private browsing, quota exceeded, etc).
    // Conversation memory is a convenience feature, so fail silently.
  }
}

function renderHistoryList() {
  const list = loadHistory();
  if (list.length === 0) {
    historyList.innerHTML = '<div class="history-empty">No past conversations yet.</div>';
    return;
  }
  historyList.innerHTML = '';
  list.forEach((entry) => {
    const btn = document.createElement('button');
    btn.className = 'history-item';
    btn.type = 'button';
    const qSpan = document.createElement('span');
    qSpan.textContent = entry.query;
    const timeSpan = document.createElement('span');
    timeSpan.className = 'h-time';
    timeSpan.textContent = new Date(entry.timestamp).toLocaleString();
    btn.appendChild(qSpan);
    btn.appendChild(timeSpan);
    btn.addEventListener('click', () => {
      renderConversation(entry);
      closeHistory();
    });
    historyList.appendChild(btn);
  });
}

function openHistory() {
  renderHistoryList();
  historyOverlay.classList.add('show');
}
function closeHistory() {
  historyOverlay.classList.remove('show');
}

historyBtn.addEventListener('click', openHistory);
closeHistoryBtn.addEventListener('click', closeHistory);
historyOverlay.addEventListener('click', (e) => {
  if (e.target === historyOverlay) closeHistory();
});
clearHistoryBtn.addEventListener('click', () => {
  localStorage.removeItem(HISTORY_KEY);
  renderHistoryList();
});

// ---- Rendering ----
function renderConversation(entry) {
  hero.classList.add('compact');
  results.classList.add('show');
  q.value = entry.query;
  qLabel.textContent = entry.query;
  answerText.innerHTML = escapeHtml(entry.answer || 'No answer available.').replace(/\n/g, '<br>');
  renderSources(entry.sources || []);
}

function renderSources(sources) {
  if (!sources || sources.length === 0) {
    sourcesBlock.innerHTML = '';
    return;
  }
  let html = '<div class="sources-label">Sources</div>';
  sources.forEach((s, i) => {
    const url = safeUrl(s.uri);
    const title = escapeHtml(s.title || s.uri || 'Untitled source');
    let domain = '';
    if (url) {
      try { domain = new URL(url).hostname.replace('www.', ''); } catch (e) {}
    }
    if (url) {
      html += `<a class="source-card" href="${url}" target="_blank" rel="noopener noreferrer">` +
        `<span class="n">${i + 1}</span>${title}` +
        `<div class="domain">${escapeHtml(domain)}</div></a>`;
    } else {
      html += `<div class="source-card"><span class="n">${i + 1}</span>${title}</div>`;
    }
  });
  sourcesBlock.innerHTML = html;
}

function setLoading(loading) {
  isLoading = loading;
  askBtn.disabled = loading;
  askBtn.textContent = loading ? '...' : 'Search';
  orb.classList.toggle('thinking', loading);
}

// ---- Ask flow ----
async function ask(rawQuery) {
  const query = String(rawQuery || '').trim().slice(0, MAX_QUERY_LENGTH);
  if (!query) return;
  if (isLoading) return;
  const now = Date.now();
  if (now - lastRequestAt < MIN_MS_BETWEEN_REQUESTS) return;
  lastRequestAt = now;

  hero.classList.add('compact');
  results.classList.add('show');
  qLabel.textContent = query;
  answerText.innerHTML = '<div class="loading-text">Searching and reading sources...</div>';
  sourcesBlock.innerHTML = '';
  setLoading(true);

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ query }),
      signal: controller.signal
    });

    if (!res.ok) throw new Error('Request failed with status ' + res.status);
    const data = await res.json();

    const answer = typeof data.answer === 'string' ? data.answer : 'Sorry, no answer was found.';
    const sources = Array.isArray(data.sources) ? data.sources : [];

    answerText.innerHTML = escapeHtml(answer).replace(/\n/g, '<br>');
    renderSources(sources);

    saveToHistory({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
      timestamp: new Date().toISOString(),
      query,
      answer,
      sources
    });
  } catch (err) {
    if (err.name === 'AbortError') {
      answerText.textContent = 'The request took too long and was cancelled. Please try again.';
    } else {
      answerText.textContent = 'A connection error occurred. Please try again.';
    }
  } finally {
    clearTimeout(timeout);
    setLoading(false);
  }
}

askBtn.addEventListener('click', () => ask(q.value));
q.addEventListener('keypress', (e) => { if (e.key === 'Enter') ask(q.value); });
document.querySelectorAll('.chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    q.value = chip.dataset.q;
    ask(chip.dataset.q);
  });
});
</script>
</body>
